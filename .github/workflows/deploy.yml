name: Deploy constantin-saguin to SiteGround

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u806-3ucq2u3ym7q9/www/constantin.saguin.com/public_html/portfolio
            git pull origin master
            cp index.html ~/www/constantin.saguin.com/public_html/index.html
            cp constantin-saguin-wp-dev.pdf ~/www/constantin.saguin.com/public_html/constantin-saguin-wp-dev.pdf
            cp robots.txt ~/www/constantin.saguin.com/public_html/robots.txt
            cp index.md ~/www/constantin.saguin.com/public_html/index.md
            mkdir -p ~/www/constantin.saguin.com/public_html/assets
            cp -r assets/. ~/www/constantin.saguin.com/public_html/assets/
            cd /home/u806-3ucq2u3ym7q9/www/constantin.saguin.com/public_html/
            curl -D - -sSX PURGE http://127.0.0.1/* -H "Host: constantin.saguin.com"
